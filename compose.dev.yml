services:
  postgres:
    image: postgres:alpine
    restart: unless-stopped
    env_file:
      - .env.dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

  redis:
    image: redis:alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data

  marketplace-server:
    init: true
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    env_file:
      - .env.dev
    depends_on:
      - postgres
      - redis
    ports:
      - "${PORT:-3001}:${PORT:-3001}"
      - "9229:9229"
    restart: unless-stopped

volumes:
  # These volumes persist data for dev services.
  # To remove them and start fresh, run `docker-compose down -v`.
  postgres-data:
  redis-data:
